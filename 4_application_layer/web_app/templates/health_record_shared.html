<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>共享健康档案 - 康联智枢</title>
    <!-- PWA 相关配置 -->
    <meta name="theme-color" content="#8B6F47">
    <meta name="description" content="共享健康档案 - 康联智枢">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/1.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="康联智枢">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-size-base: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: url('/static/background.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            padding: 20px;
            color: #5D4E37;
            font-size: var(--font-size-base);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 248, 240, 0.85);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 40px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(139, 111, 71, 0.15);
            text-align: center;
            border: 2px solid #F5EBE0;
        }

        h1 {
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 2.25);
            margin-bottom: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8B7355;
            font-size: var(--font-size-base);
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-link {
            color: #5D4E37;
            text-decoration: none;
            font-size: calc(var(--font-size-base) * 1.25);
            font-weight: 600;
            padding: 18px 35px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 111, 71, 0.15);
            border: 2px solid #C9A58C;
            min-width: 160px;
            text-align: center;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(139, 111, 71, 0.3);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            color: white;
        }

        .content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(139, 111, 71, 0.15);
            border: 2px solid #F5EBE0;
        }

        h2 {
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 1.5);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #C9A58C;
            font-weight: 600;
        }

        h3 {
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 1.125);
            margin: 20px 0 15px;
            font-weight: 600;
            position: relative;
            padding-left: 15px;
        }

        h3:before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 20px;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            border-radius: 3px;
        }

        .card {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF8F0 100%);
            border: 1px solid #F5EBE0;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            transition: box-shadow 0.3s ease;
            box-shadow: 0 5px 20px rgba(139, 111, 71, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: 0 8px 25px rgba(139, 111, 71, 0.2);
        }

        .card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
        }

        .card h4 {
            color: #8B6F47;
            margin-bottom: 15px;
            font-size: calc(var(--font-size-base) * 1.125);
            font-weight: 600;
        }

        .card p {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #5D4E37;
            font-size: var(--font-size-base);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #FFF8F0 0%, #F5EBE0 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #E8DCC8;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(139, 111, 71, 0.2);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: #8B6F47;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 16px;
            color: #A89070;
            font-weight: 500;
        }

        .alert {
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .alert.error {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #8B6F47;
            font-size: 18px;
        }

        .error-message {
            text-align: center;
            padding: 50px;
            color: #c62828;
            font-size: 18px;
        }

        .timeline-container {
            background: #FFF8F0;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #E8DCC8;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-left: 30px;
            position: relative;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            border-radius: 50%;
            border: 3px solid #FFF;
            box-shadow: 0 2px 8px rgba(139, 111, 71, 0.3);
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: 13px;
            top: 24px;
            width: 2px;
            height: calc(100% + 20px);
            background: #E8DCC8;
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-date {
            font-size: 14px;
            color: #A89070;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .timeline-content {
            background: #FFF;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #F5EBE0;
        }

        .timeline-title {
            font-size: 16px;
            font-weight: 600;
            color: #8B6F47;
            margin-bottom: 5px;
        }

        .timeline-desc {
            font-size: 14px;
            color: #6B5B45;
        }

        .chart-container {
            background: #FFF8F0;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #E8DCC8;
        }

        .medication-bar {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .medication-bar:last-child {
            margin-bottom: 0;
        }

        .med-name {
            width: 150px;
            font-size: 14px;
            color: #8B6F47;
            font-weight: 500;
            flex-shrink: 0;
        }

        .med-bar-wrapper {
            flex: 1;
            background: #F5EBE0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 0 15px;
        }

        .med-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #C9A58C 0%, #8B6F47 100%);
            border-radius: 15px;
            transition: width 0.8s ease;
        }

        .med-count {
            width: 50px;
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: #8B6F47;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #A89070;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .content {
                padding: 20px;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }

            .nav-link {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>共享健康档案</h1>
            <p class="subtitle">康联智枢 - 您的个人健康助手</p>

            <!-- 字体大小控制 -->
            <div style="display: flex; justify-content: center; margin-bottom: 20px; gap: 8px;">
                <button id="decrease-font" class="btn" 
                    style="background: #f8f9fa; color: #5D4E37; border: 2px solid #C9A58C; padding: 6px 12px; font-size: 14px; width: 40px; text-align: center; border-radius: 6px;">A-</button>
                <button id="reset-font" class="btn" 
                    style="background: #f8f9fa; color: #5D4E37; border: 2px solid #C9A58C; padding: 6px 12px; font-size: 14px; width: 40px; text-align: center; border-radius: 6px;">A</button>
                <button id="increase-font" class="btn" 
                    style="background: #f8f9fa; color: #5D4E37; border: 2px solid #C9A58C; padding: 6px 12px; font-size: 14px; width: 40px; text-align: center; border-radius: 6px;">A+</button>
            </div>

            <!-- 导航栏 -->
            <div class="nav-links">
                <a href="/" class="nav-link">首页</a>
                <a href="/health_record" class="nav-link">健康档案</a>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="content" id="healthContent" style="display: none;">
            <!-- 健康数据概览 -->
            <h2>📊 健康数据概览</h2>
            <div class="stats-grid" id="statsGrid">
                <!-- 统计卡片将通过JavaScript动态生成 -->
            </div>

            <!-- 健康风险预警 -->
            <h3 style="margin-top: 30px;">⚠️ 健康风险预警</h3>
            <div class="card" id="riskAlertCard">
                <!-- 风险预警将通过JavaScript动态生成 -->
            </div>

            <!-- 健康建议 -->
            <h3 style="margin-top: 30px;">💡 健康建议</h3>
            <div id="recommendationsContainer">
                <!-- 健康建议将通过JavaScript动态生成 -->
            </div>

            <!-- 病史记录 -->
            <h3 style="margin-top: 30px;">📋 病史记录</h3>
            <div class="timeline-container" id="medicalHistoryTimeline">
                <!-- 病史时间线将通过JavaScript动态生成 -->
            </div>

            <!-- 用药记录 -->
            <h3 style="margin-top: 30px;">💊 用药记录</h3>
            <div class="chart-container" id="medicationChart">
                <!-- 用药分布图表将通过JavaScript动态生成 -->
            </div>

            <!-- 生理指标 -->
            <h3 style="margin-top: 30px;">📈 生理指标</h3>
            <div id="vitalSignsContainer">
                <!-- 生理指标将通过JavaScript动态生成 -->
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="content" id="loadingContainer">
            <div class="loading">
                <p>正在加载健康档案...</p>
            </div>
        </div>

        <!-- 错误状态 -->
        <div class="content" id="errorContainer" style="display: none;">
            <div class="error-message">
                <p id="errorMessage">加载健康档案失败</p>
            </div>
        </div>
    </div>

    <script>
        // 字体大小控制
        document.getElementById('decrease-font').addEventListener('click', function() {
            const root = document.documentElement;
            let fontSize = parseFloat(getComputedStyle(root).getPropertyValue('--font-size-base'));
            if (fontSize > 12) {
                fontSize -= 2;
                root.style.setProperty('--font-size-base', fontSize + 'px');
                localStorage.setItem('fontSize', fontSize);
            }
        });

        document.getElementById('reset-font').addEventListener('click', function() {
            const root = document.documentElement;
            root.style.setProperty('--font-size-base', '16px');
            localStorage.setItem('fontSize', 16);
        });

        document.getElementById('increase-font').addEventListener('click', function() {
            const root = document.documentElement;
            let fontSize = parseFloat(getComputedStyle(root).getPropertyValue('--font-size-base'));
            if (fontSize < 24) {
                fontSize += 2;
                root.style.setProperty('--font-size-base', fontSize + 'px');
                localStorage.setItem('fontSize', fontSize);
            }
        });

        // 加载保存的字体大小
        const savedFontSize = localStorage.getItem('fontSize');
        if (savedFontSize) {
            document.documentElement.style.setProperty('--font-size-base', savedFontSize + 'px');
        }

        // 从URL获取参数
        function getUrlParams() {
            const params = {};
            const urlParams = new URLSearchParams(window.location.search);
            for (const [key, value] of urlParams.entries()) {
                params[key] = value;
            }
            return params;
        }

        // 加载健康档案
        function loadHealthRecord() {
            const params = getUrlParams();
            const user_id = params.user_id;
            const token = params.token;

            if (!user_id || !token) {
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('errorContainer').style.display = 'block';
                document.getElementById('errorMessage').textContent = '无效的访问链接';
                return;
            }

            // 调用API获取共享健康档案
            fetch(`/api/health/record/shared?user_id=${user_id}&token=${token}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const record = data.data;
                        renderHealthRecord(record);
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('healthContent').style.display = 'block';
                    } else {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('errorContainer').style.display = 'block';
                        document.getElementById('errorMessage').textContent = data.message || '加载健康档案失败';
                    }
                })
                .catch(error => {
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('errorContainer').style.display = 'block';
                    document.getElementById('errorMessage').textContent = '网络错误，请稍后重试';
                });
        }

        // 渲染健康档案
        function renderHealthRecord(record) {
            // 渲染统计卡片
            renderStats(record);

            // 渲染风险预警
            renderRiskAlert(record.risk_alert);

            // 渲染健康建议
            renderRecommendations(record.recommendations);

            // 渲染病史记录
            renderMedicalHistory(record.medical_history || []);

            // 渲染用药记录
            renderMedicationChart(record.medications || []);

            // 渲染生理指标
            renderVitalSigns(record.vital_signs || []);
        }

        // 渲染统计卡片
        function renderStats(record) {
            const statsGrid = document.getElementById('statsGrid');
            const basicInfo = record.basic_info || {};
            const medicalHistory = record.medical_history || [];
            const allergies = record.allergies || [];
            const medications = record.medications || [];
            const vitalSigns = record.vital_signs || [];

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${basicInfo.name || '未知'}</div>
                    <div class="stat-label">姓名</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${basicInfo.age || '未知'}</div>
                    <div class="stat-label">年龄</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${medicalHistory.length}</div>
                    <div class="stat-label">病史记录</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${medications.length}</div>
                    <div class="stat-label">用药记录</div>
                </div>
            `;
        }

        // 渲染风险预警
        function renderRiskAlert(riskAlert) {
            const riskAlertCard = document.getElementById('riskAlertCard');

            if (!riskAlert) {
                riskAlertCard.innerHTML = '<h4>健康风险预警</h4><p>暂无风险预警</p>';
                return;
            }

            let levelClass = '';
            switch (riskAlert.level) {
                case 'high':
                    levelClass = 'error';
                    break;
                case 'medium':
                    levelClass = 'warning';
                    break;
                default:
                    levelClass = 'success';
            }

            let detailsHtml = '';
            if (riskAlert.details && riskAlert.details.length > 0) {
                detailsHtml = '<ul style="margin-top: 10px; padding-left: 20px;">';
                riskAlert.details.forEach(detail => {
                    detailsHtml += `<li>${detail}</li>`;
                });
                detailsHtml += '</ul>';
            }

            riskAlertCard.innerHTML = `
                <h4>健康风险预警</h4>
                <p class="${levelClass}"><strong>风险等级：</strong>${riskAlert.message}</p>
                ${detailsHtml}
            `;
        }

        // 渲染健康建议
        function renderRecommendations(recommendations) {
            const recommendationsContainer = document.getElementById('recommendationsContainer');

            if (!recommendations || !recommendations.recommendations || recommendations.recommendations.length === 0) {
                recommendationsContainer.innerHTML = '<div class="card"><h4>健康建议</h4><p>暂无健康建议</p></div>';
                return;
            }

            let html = '';
            recommendations.recommendations.forEach(rec => {
                html += `
                    <div class="card">
                        <h4>${rec.title}</h4>
                        <p>${rec.content.replace(/\n/g, '<br>')}</p>
                    </div>
                `;
            });

            recommendationsContainer.innerHTML = html;
        }

        // 渲染病史记录
        function renderMedicalHistory(medicalHistory) {
            const timelineContainer = document.getElementById('medicalHistoryTimeline');

            if (medicalHistory.length === 0) {
                timelineContainer.innerHTML = '<div class="empty-state">暂无病史记录</div>';
                return;
            }

            // 按日期排序
            const sortedHistory = [...medicalHistory].sort((a, b) => {
                const dateA = new Date(a.diagnosis_date || a.added_at);
                const dateB = new Date(b.diagnosis_date || b.added_at);
                return dateB - dateA;
            });

            let html = '';
            sortedHistory.forEach(item => {
                const date = item.diagnosis_date || item.added_at?.split('T')[0] || '未知日期';
                const disease = item.disease || '未知疾病';
                const desc = item.description || '暂无描述';

                html += `
                    <div class="timeline-item">
                        <div>
                            <div class="timeline-date">${date}</div>
                            <div class="timeline-content">
                                <div class="timeline-title">${disease}</div>
                                <div class="timeline-desc">${desc}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            timelineContainer.innerHTML = html;
        }

        // 渲染用药记录
        function renderMedicationChart(medications) {
            const medicationChart = document.getElementById('medicationChart');

            if (medications.length === 0) {
                medicationChart.innerHTML = '<div class="empty-state">暂无用药记录</div>';
                return;
            }

            // 统计每种药物的使用次数
            const medCounts = {};
            medications.forEach(med => {
                const name = med.name || '未知药物';
                medCounts[name] = (medCounts[name] || 0) + 1;
            });

            // 转换为数组并排序
            const medArray = Object.entries(medCounts)
                .map(([name, count]) => ({ name, count }))
                .sort((a, b) => b.count - a.count);

            const maxCount = Math.max(...medArray.map(m => m.count));

            let html = '';
            medArray.forEach(med => {
                const percentage = (med.count / maxCount) * 100;
                html += `
                    <div class="medication-bar">
                        <div class="med-name">${med.name.length > 8 ? med.name.substring(0, 8) + '...' : med.name}</div>
                        <div class="med-bar-wrapper">
                            <div class="med-bar-fill" style="width: ${percentage}%;"></div>
                        </div>
                        <div class="med-count">${med.count}次</div>
                    </div>
                `;
            });

            medicationChart.innerHTML = html;
        }

        // 渲染生理指标
        function renderVitalSigns(vitalSigns) {
            const vitalSignsContainer = document.getElementById('vitalSignsContainer');

            if (vitalSigns.length === 0) {
                vitalSignsContainer.innerHTML = '<div class="card"><h4>生理指标</h4><p>暂无生理指标记录</p></div>';
                return;
            }

            // 按类型分组
            const vitalByType = {};
            vitalSigns.forEach(vital => {
                const type = vital.type;
                if (!vitalByType[type]) {
                    vitalByType[type] = [];
                }
                vitalByType[type].push(vital);
            });

            let html = '';
            for (const [type, vitals] of Object.entries(vitalByType)) {
                // 按时间排序
                const sortedVitals = vitals.sort((a, b) => {
                    const dateA = new Date(a.measured_at || a.added_at);
                    const dateB = new Date(b.measured_at || b.added_at);
                    return dateB - dateA;
                });

                // 获取最近的记录
                const latestVital = sortedVitals[0];
                let valueText = '';
                switch (type) {
                    case 'blood_pressure':
                        valueText = `${latestVital.value}/${latestVital.secondary_value} mmHg`;
                        break;
                    case 'heart_rate':
                        valueText = `${latestVital.value} 次/分`;
                        break;
                    case 'blood_sugar':
                        valueText = `${latestVital.value} mmol/L`;
                        break;
                    case 'temperature':
                        valueText = `${latestVital.value} °C`;
                        break;
                    case 'weight':
                        valueText = `${latestVital.value} kg`;
                        break;
                    case 'oxygen':
                        valueText = `${latestVital.value} %`;
                        break;
                    default:
                        valueText = latestVital.value;
                }

                const date = latestVital.measured_at ? new Date(latestVital.measured_at).toLocaleString() : latestVital.added_at ? new Date(latestVital.added_at).toLocaleString() : '未知时间';

                html += `
                    <div class="card">
                        <h4>${getVitalTypeName(type)}</h4>
                        <p><strong>最新值：</strong>${valueText}</p>
                        <p><strong>测量时间：</strong>${date}</p>
                        <p><strong>记录数量：</strong>${vitals.length}条</p>
                    </div>
                `;
            }

            vitalSignsContainer.innerHTML = html;
        }

        // 获取生理指标类型名称
        function getVitalTypeName(type) {
            const typeNames = {
                'blood_pressure': '血压',
                'heart_rate': '心率',
                'blood_sugar': '血糖',
                'temperature': '体温',
                'weight': '体重',
                'oxygen': '血氧'
            };
            return typeNames[type] || type;
        }

        // 页面加载时执行
        window.onload = function() {
            loadHealthRecord();
        };
    </script>
</body>

</html>
