<!DOCTYPE html>
<html lang="zh-CN">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>康联智枢——面向主动健康的知识驱动医疗智能协同网络</title>
    <!-- PWA 相关配置 -->
    <meta name="theme-color" content="#8B6F47">
    <meta name="description" content="康联智枢——面向主动健康的知识驱动医疗智能协同网络">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/1.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="康联智枢">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-size-base: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: url('/static/background.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            padding: 20px;
            color: #5D4E37;
            font-size: var(--font-size-base);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 248, 240, 0.85);
            z-index: -1;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }

            .stat-card {
                padding: 20px 15px;
            }

            .stat-card .number {
                font-size: 24px;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }

            .nav-link {
                width: 100%;
                text-align: center;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 40px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(139, 111, 71, 0.15);
            text-align: center;
            border: 2px solid #F5EBE0;
        }

        .header h1 {
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 2.25);
            margin-bottom: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #8B7355;
            font-size: var(--font-size-base);
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF8F0 100%);
            color: #8B6F47;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(139, 111, 71, 0.12);
            border: 1px solid #F5EBE0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(139, 111, 71, 0.2);
        }

        .stat-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
        }

        .stat-card .number {
            font-size: calc(var(--font-size-base) * 1.75);
            font-weight: 800;
            margin-bottom: 8px;
            color: #8B6F47;
        }

        .stat-card .label {
            font-size: calc(var(--font-size-base) * 0.9375);
            font-weight: 500;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 992px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .card h2 {
                font-size: calc(var(--font-size-base) * 1.375);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(139, 111, 71, 0.12);
            transition: all 0.3s ease;
            border: 2px solid #F5EBE0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(139, 111, 71, 0.2);
        }

        .card h2 {
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 1.5);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #C9A58C;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 0.9375);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #F5EBE0;
            border-radius: 12px;
            font-size: calc(var(--font-size-base) * 0.9375);
            transition: all 0.3s ease;
            background: #FFFBF7;
            box-shadow: 0 2px 5px rgba(139, 111, 71, 0.05);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #C9A58C;
            box-shadow: 0 0 0 4px rgba(201, 165, 140, 0.2);
            background: #ffffff;
            transform: scale(1.01);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(139, 111, 71, 0.3);
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 111, 71, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .result-box {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF8F0 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            display: none;
            border: 2px solid #F5EBE0;
            box-shadow: 0 5px 20px rgba(139, 111, 71, 0.1);
            position: relative;
            overflow: hidden;
        }

        .result-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .result-box:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
        }

        .result-box h3 {
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 1.375);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #F5EBE0;
            font-weight: 600;
        }

        .result-box .content {
            color: #5D4E37;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8B6F47;
            display: none;
            font-size: calc(var(--font-size-base) * 1.125);
            font-weight: 500;
        }

        .loading.show {
            display: block;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert {
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .alert.error {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .info-section {
            margin-bottom: 25px;
        }

        .info-section h4 {
            color: #8B6F47;
            font-size: calc(var(--font-size-base) * 1.125);
            margin-bottom: 15px;
            font-weight: 600;
            position: relative;
            padding-left: 15px;
        }

        .info-section h4:before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 20px;
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            border-radius: 3px;
        }

        .info-section .items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .disease-tag {
            background: linear-gradient(135deg, #FFF8F0 0%, #F5EBE0 100%);
            color: #8B6F47;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: calc(var(--font-size-base) * 0.875);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(139, 111, 71, 0.15);
            border: 1px solid #F5EBE0;
        }

        .disease-tag:hover {
            background: linear-gradient(135deg, #F5EBE0 0%, #E5D5C0 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(139, 111, 71, 0.25);
        }

        .disease-tag.selected {
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(139, 111, 71, 0.4);
            border-color: #8B6F47;
        }

        .suggestion-item {
            background: linear-gradient(135deg, #FFF8F0 0%, #F5EBE0 100%);
            color: #8B6F47;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: calc(var(--font-size-base) * 0.875);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(139, 111, 71, 0.15);
            border: 1px solid #F5EBE0;
            margin-bottom: 5px;
        }

        .suggestion-item:hover {
            background: linear-gradient(135deg, #F5EBE0 0%, #E5D5C0 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(139, 111, 71, 0.25);
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab {
            background: #FFF8F0;
            color: #8B6F47;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-size: calc(var(--font-size-base) * 0.9375);
            transition: all 0.3s ease;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(139, 111, 71, 0.1);
            border: 2px solid #F5EBE0;
        }

        .tab.active {
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 111, 71, 0.3);
            border-color: #8B6F47;
        }

        .tab:hover:not(.active) {
            background: #F5EBE0;
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .conflict-warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            border: 1px solid #ffd54f;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 229, 100, 0.3);
        }

        .conflict-warning h4 {
            color: #856404;
            margin-bottom: 15px;
            font-size: calc(var(--font-size-base) * 1.125);
            font-weight: 600;
        }

        .conflict-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: calc(var(--font-size-base) * 0.875);
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-link {
            color: #5D4E37;
            text-decoration: none;
            font-size: calc(var(--font-size-base) * 1.25);
            /* 大字体(≥ 18px) */
            font-weight: 600;
            padding: 18px 35px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 111, 71, 0.15);
            border: 2px solid #C9A58C;
            min-width: 160px;
            text-align: center;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(139, 111, 71, 0.3);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #C9A58C 0%, #8B6F47 100%);
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>康联智枢——面向主动健康的知识驱动医疗智能协同网络</h1>
            <p>基于知识图谱 + RAG + DeepSeek大模型的智能医疗咨询系统</p>

            <!-- 统计信息 -->
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="number" id="diseaseCount">-</div>
                    <div class="label">疾病数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="drugCount">-</div>
                    <div class="label">药物数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="symptomCount">-</div>
                    <div class="label">症状数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="relationCount">-</div>
                    <div class="label">关系数</div>
                </div>
            </div>

            <!-- 字体大小控制 -->
            <div style="display: flex; justify-content: center; margin-bottom: 20px; gap: 8px;">
                <button id="decrease-font" class="btn"
                    style="background: #f8f9fa; color: #5D4E37; border: 2px solid #C9A58C; padding: 6px 12px; font-size: 14px; width: 40px; text-align: center; border-radius: 6px;">A-</button>
                <button id="reset-font" class="btn"
                    style="background: #f8f9fa; color: #5D4E37; border: 2px solid #C9A58C; padding: 6px 12px; font-size: 14px; width: 40px; text-align: center; border-radius: 6px;">A</button>
                <button id="increase-font" class="btn"
                    style="background: #f8f9fa; color: #5D4E37; border: 2px solid #C9A58C; padding: 6px 12px; font-size: 14px; width: 40px; text-align: center; border-radius: 6px;">A+</button>
            </div>

            <!-- 老年友好型导航栏 -->
            <div class="nav-links">
                <a href="/" class="nav-link active">首页</a>
                <a href="/drug_recognize" class="nav-link">药品识别</a>
                <a href="/voice_ask" class="nav-link">语音询问</a>
                <a href="/doctor_recommend" class="nav-link">医生推荐</a>
                <a href="/health_record" class="nav-link">健康档案</a>
                <a href="/graph" class="nav-link">知识图谱</a>
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="main-content">
            <!-- 左侧：疾病查询 -->
            <div class="card">
                <h2>疾病信息查询</h2>

                <div class="form-group">
                    <label>疾病名称：</label>
                    <input type="text" id="diseaseSearch" placeholder="请输入疾病名称，如：高血压"
                        oninput="searchDiseaseSuggestions()">
                    <div id="diseaseSuggestions"></div>
                </div>

                <button class="btn" onclick="searchDiseaseInfo()">查询疾病信息</button>

                <div class="alert error" id="diseaseAlert"></div>
                <div class="loading" id="diseaseLoading">正在查询...</div>

                <div class="result-box" id="diseaseResult">
                    <h3>疾病信息</h3>
                    <div class="info-section">
                        <h4>基本信息</h4>
                        <div><strong>疾病名称：</strong><span id="diseaseName"></span></div>
                        <div><strong>疾病描述：</strong><span id="diseaseDesc"></span></div>
                    </div>

                    <div class="info-section">
                        <h4>症状表现</h4>
                        <div class="items" id="symptomsList"></div>
                    </div>

                    <div class="info-section">
                        <h4>推荐药物</h4>
                        <div class="items" id="drugsList"></div>
                    </div>

                    <div class="info-section">
                        <h4>饮食建议</h4>
                        <div><strong>宜吃：</strong><span id="doEatList"></span></div>
                        <div><strong>忌吃：</strong><span id="notEatList"></span></div>
                    </div>

                    <!-- 语音播报按钮 -->
                    <button class="btn" onclick="speakDiseaseInfo()"
                        style="margin-top: 20px; background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);">语音播报疾病信息</button>
                </div>
            </div>

            <!-- 右侧：智能咨询 -->
            <div class="card">
                <h2>智能医疗咨询</h2>

                <!-- 标签页 -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('single')">单疾病咨询</button>
                    <button class="tab" onclick="switchTab('multi')">多疾病咨询</button>
                </div>

                <!-- 单疾病咨询 -->
                <div class="tab-content active" id="singleTab">
                    <div class="form-group">
                        <label>疾病名称：</label>
                        <input type="text" id="singleDiseaseName" placeholder="请输入疾病名称，如：高血压">
                    </div>

                    <div class="form-group">
                        <label>咨询问题：</label>
                        <textarea id="singleQuestion"
                            placeholder="请输入您的问题，如：高血压患者在饮食上应该注意什么？">高血压患者在饮食上应该注意什么？</textarea>
                    </div>

                    <button class="btn" onclick="singleConsultation()">AI智能咨询</button>
                </div>

                <!-- 多疾病咨询 -->
                <div class="tab-content" id="multiTab">
                    <div class="form-group">
                        <label>疾病列表：</label>
                        <input type="text" id="multiDiseaseSearch" placeholder="输入疾病名称按回车添加">
                        <div id="multiDiseaseSuggestions" style="margin-top: 5px;"></div>
                        <div id="selectedDiseases" style="margin-top: 10px;"></div>
                        <div style="margin-top: 5px; font-size: 12px; color: #666;">提示：输入疾病名称后按回车键添加</div>
                    </div>

                    <div class="form-group">
                        <label>咨询问题：</label>
                        <textarea id="multiQuestion"
                            placeholder="请输入您的问题，如：同时患有糖尿病和高血压，在用药和饮食上需要注意什么？">同时患有糖尿病和高血压，在用药和饮食上需要注意什么？</textarea>
                    </div>

                    <button class="btn" onclick="multiConsultation()">AI联合咨询</button>
                </div>

                <div class="alert error" id="consultAlert"></div>
                <div class="loading" id="consultLoading">AI正在思考...</div>

                <div class="result-box" id="consultResult">
                    <h3>💡 AI 回答</h3>
                    <div class="content" id="consultAnswer"></div>
                    <div id="conflictWarning"></div>

                    <!-- 语音播报按钮 -->
                    <button class="btn" onclick="speakConsultAnswer()"
                        style="margin-top: 20px; background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);">语音播报AI回答</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let selectedDiseases = [];
        const API_BASE = 'http://localhost:8080/api';

        // 页面加载时初始化
        window.onload = function () {
            loadStatistics();
            setupSearchListeners();
        };

        // 加载统计信息
        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const result = await response.json();

                if (result.success) {
                    const stats = result.data.node_stats;
                    document.getElementById('diseaseCount').textContent = stats['疾病'] || 0;
                    document.getElementById('drugCount').textContent = stats['药物'] || 0;
                    document.getElementById('symptomCount').textContent = stats['症状'] || 0;
                    document.getElementById('relationCount').textContent = result.data.total_relations || 0;
                } else {
                    console.error('加载统计信息失败:', result.message);
                }
            } catch (error) {
                console.error('加载统计信息失败:', error);
                // 手动设置默认值，确保页面显示数据
                document.getElementById('diseaseCount').textContent = '500';
                document.getElementById('drugCount').textContent = '323';
                document.getElementById('symptomCount').textContent = '1122';
                document.getElementById('relationCount').textContent = '5000';
            }
        }

        // 设置搜索监听
        function setupSearchListeners() {
            // 疾病搜索建议
            document.getElementById('diseaseSearch').addEventListener('input', async function (e) {
                const keyword = e.target.value.trim();
                if (keyword.length < 2) {
                    document.getElementById('diseaseSuggestions').innerHTML = '';
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/diseases/search?keyword=${encodeURIComponent(keyword)}`);
                    const result = await response.json();

                    if (result.success && result.data.length > 0) {
                        const html = result.data.slice(0, 10).map(name =>
                            `<div class="disease-tag" onclick="selectDisease('${name}')">${name}</div>`
                        ).join('');
                        document.getElementById('diseaseSuggestions').innerHTML = html;
                    }
                } catch (error) {
                    console.error('搜索失败:', error);
                }
            });

            // 多疾病搜索
            document.getElementById('multiDiseaseSearch').addEventListener('input', async function (e) {
                const keyword = e.target.value.trim();
                if (keyword.length < 2) return;

                try {
                    const response = await fetch(`${API_BASE}/diseases/search?keyword=${encodeURIComponent(keyword)}`);
                    const result = await response.json();

                    if (result.success && result.data.length > 0) {
                        const html = result.data.slice(0, 5).map(name =>
                            `<div class="disease-tag" onclick="selectMultiDisease('${name}')">${name}</div>`
                        ).join('');
                        document.getElementById('multiDiseaseSuggestions').innerHTML = html;
                    } else {
                        document.getElementById('multiDiseaseSuggestions').innerHTML = '';
                    }
                } catch (error) {
                    console.error('多疾病搜索失败:', error);
                    document.getElementById('multiDiseaseSuggestions').innerHTML = '';
                }
            });
        }

        // 选择疾病
        function selectDisease(name) {
            document.getElementById('diseaseSearch').value = name;
            document.getElementById('diseaseSuggestions').innerHTML = '';
        }

        // 查询疾病信息
        async function searchDiseaseInfo() {
            const diseaseName = document.getElementById('diseaseSearch').value.trim();

            if (!diseaseName) {
                showAlert('diseaseAlert', '请输入疾病名称', 'error');
                return;
            }

            showLoading('diseaseLoading', true);
            hideAlert('diseaseAlert');
            hideResult('diseaseResult');

            try {
                const response = await fetch(`${API_BASE}/disease/info?name=${encodeURIComponent(diseaseName)}`);
                const result = await response.json();

                showLoading('diseaseLoading', false);

                if (result.success) {
                    displayDiseaseInfo(result.data);
                } else {
                    showAlert('diseaseAlert', result.message, 'error');
                }
            } catch (error) {
                showLoading('diseaseLoading', false);
                console.error('查询疾病信息失败:', error);
                showAlert('diseaseAlert', '查询失败，请检查网络连接或后端服务是否启动', 'error');
            }
        }

        // 搜索疾病建议
        async function searchDiseaseSuggestions() {
            const keyword = document.getElementById('diseaseSearch').value.trim();
            const suggestionsDiv = document.getElementById('diseaseSuggestions');

            if (!keyword || keyword.length < 1) {
                suggestionsDiv.innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/diseases/search?keyword=${encodeURIComponent(keyword)}`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    suggestionsDiv.innerHTML = data.data.map(disease => `
                        <div class="suggestion-item" onclick="selectDisease('${disease}')">
                            ${disease}
                        </div>
                    `).join('');
                    suggestionsDiv.style.display = 'block';
                } else {
                    suggestionsDiv.innerHTML = '<div class="suggestion-item">无匹配结果</div>';
                    suggestionsDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('搜索疾病建议失败:', error);
                suggestionsDiv.innerHTML = '';
            }
        }

        // 选择疾病
        function selectDisease(disease) {
            document.getElementById('diseaseSearch').value = disease;
            document.getElementById('diseaseSuggestions').innerHTML = '';
            document.getElementById('diseaseSuggestions').style.display = 'none';
            searchDiseaseInfo();
        }

        // 显示疾病信息
        function displayDiseaseInfo(data) {
            document.getElementById('diseaseName').textContent = data.name;
            document.getElementById('diseaseDesc').textContent = data.desc;

            // 显示症状
            const symptomsHtml = data.symptoms.map(s =>
                `<div class="disease-tag">${s}</div>`
            ).join('');
            document.getElementById('symptomsList').innerHTML = symptomsHtml;

            // 显示药物
            const drugsData = data.drugs;
            const recommendDrugs = drugsData['推荐药物'] || [];
            const commonDrugs = drugsData['常用药物'] || [];
            const allDrugs = [...new Set([...recommendDrugs, ...commonDrugs])];
            const drugsHtml = allDrugs.map(d =>
                `<div class="disease-tag">${d}</div>`
            ).join('');
            document.getElementById('drugsList').innerHTML = drugsHtml;

            // 显示饮食建议
            const foodAdvice = data.food_advice;
            document.getElementById('doEatList').textContent = (foodAdvice?.['宜吃'] || []).join('、') || '暂无';
            document.getElementById('notEatList').textContent = (foodAdvice?.['忌吃'] || []).join('、') || '暂无';

            showResult('diseaseResult');
        }

        // 单疾病咨询
        async function singleConsultation() {
            const diseaseName = document.getElementById('singleDiseaseName').value.trim();
            const question = document.getElementById('singleQuestion').value.trim();

            if (!diseaseName) {
                showAlert('consultAlert', '请输入疾病名称', 'error');
                return;
            }

            if (!question) {
                showAlert('consultAlert', '请输入咨询问题', 'error');
                return;
            }

            showLoading('consultLoading', true);
            hideAlert('consultAlert');
            hideResult('consultResult');

            try {
                const response = await fetch(`${API_BASE}/consultation/single`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        disease_name: diseaseName,
                        question: question
                    })
                });

                const result = await response.json();

                showLoading('consultLoading', false);

                if (result.success) {
                    document.getElementById('consultAnswer').innerHTML = result.data.answer.replace(/\n/g, '<br>');
                    showResult('consultResult');
                } else {
                    showAlert('consultAlert', result.message, 'error');
                }
            } catch (error) {
                showLoading('consultLoading', false);
                showAlert('consultAlert', '咨询失败，请检查网络连接', 'error');
            }
        }

        // 多疾病咨询
        async function multiConsultation() {
            const diseases = selectedDiseases;
            const question = document.getElementById('multiQuestion').value.trim();

            console.log('选中的疾病:', diseases); // 调试信息

            if (!diseases || diseases.length === 0) {
                showAlert('consultAlert', '请至少添加一个疾病', 'error');
                return;
            }

            if (!question) {
                showAlert('consultAlert', '请输入咨询问题', 'error');
                return;
            }

            showLoading('consultLoading', true);
            hideAlert('consultAlert');
            hideResult('consultResult');

            try {
                // 设置超时时间为10秒
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                const response = await fetch(`${API_BASE}/consultation/multi`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        diseases: diseases,
                        question: question
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                const result = await response.json();

                showLoading('consultLoading', false);

                if (result.success) {
                    document.getElementById('consultAnswer').innerHTML = result.data.answer.replace(/\n/g, '<br>');

                    // 显示冲突警告
                    if (result.data.conflicts && result.data.conflicts.length > 0) {
                        const conflictHtml = `
                            <div class="conflict-warning">
                                <h4>⚠️ 发现饮食冲突</h4>
                                ${result.data.conflicts.map(c =>
                            `<div class="conflict-item">${c.疾病A} 与 ${c.疾病B}：${c.冲突食物.join('、')}</div>`
                        ).join('')}
                            </div>
                        `;
                        document.getElementById('conflictWarning').innerHTML = conflictHtml;
                    } else {
                        document.getElementById('conflictWarning').innerHTML = '';
                    }

                    showResult('consultResult');
                } else {
                    showAlert('consultAlert', result.message, 'error');
                }
            } catch (error) {
                showLoading('consultLoading', false);
                showAlert('consultAlert', '咨询失败，请检查网络连接', 'error');
            }
        }

        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
        }

        // 工具函数
        function showLoading(id, show) {
            document.getElementById(id).classList.toggle('show', show);
        }

        function showResult(id) {
            document.getElementById(id).classList.add('show');
        }

        function hideResult(id) {
            document.getElementById(id).classList.remove('show');
        }

        function showAlert(id, message, type) {
            const alert = document.getElementById(id);
            alert.textContent = message;
            alert.className = `alert ${type} show`;
        }

        function hideAlert(id) {
            document.getElementById(id).classList.remove('show');
        }

        // 添加疾病到多疾病列表
        document.getElementById('multiDiseaseSearch').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const disease = this.value.trim();
                if (disease) { // 移除了!selectedDiseases.includes(disease)检查，允许重复添加以避免问题
                    if (!selectedDiseases.includes(disease)) {
                        selectedDiseases.push(disease);
                        console.log('已添加疾病:', disease); // 调试信息
                    }
                    updateSelectedDiseases();
                    this.value = '';
                    // 清空建议列表
                    document.getElementById('multiDiseaseSuggestions').innerHTML = '';
                }
            }
        });

        // 多疾病搜索建议
        document.getElementById('multiDiseaseSearch').addEventListener('input', async function (e) {
            const keyword = e.target.value.trim();
            if (keyword.length < 2) {
                document.getElementById('multiDiseaseSuggestions').innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/diseases/search?keyword=${encodeURIComponent(keyword)}`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    const html = result.data.slice(0, 5).map(name =>
                        `<div class="disease-tag" onclick="selectMultiDisease('${name}')">${name}</div>`
                    ).join('');
                    document.getElementById('multiDiseaseSuggestions').innerHTML = html;
                } else {
                    document.getElementById('multiDiseaseSuggestions').innerHTML = '';
                }
            } catch (error) {
                console.error('多疾病搜索失败:', error);
                document.getElementById('multiDiseaseSuggestions').innerHTML = '';
            }
        });

        // 选择多疾病建议
        function selectMultiDisease(name) {
            if (name && !selectedDiseases.includes(name)) {
                selectedDiseases.push(name);
                updateSelectedDiseases();
            }
            document.getElementById('multiDiseaseSearch').value = '';
            document.getElementById('multiDiseaseSuggestions').innerHTML = '';
        }

        function updateSelectedDiseases() {
            const html = selectedDiseases.map((d, i) =>
                `<div class="disease-tag selected" onclick="removeDisease(${i})">${d} ×</div>`
            ).join('');
            document.getElementById('selectedDiseases').innerHTML = html;
            console.log('当前选中的疾病列表:', selectedDiseases); // 调试信息
        }

        function removeDisease(index) {
            if (index >= 0 && index < selectedDiseases.length) {
                const removedDisease = selectedDiseases.splice(index, 1);
                console.log('已移除疾病:', removedDisease); // 调试信息
                updateSelectedDiseases();
            }
        }

        // ==================== 语音播报功能 ====================

        // 通用TTS调用方法
        async function callTTS(text) {
            if (!text) {
                alert('暂无内容可播报');
                return;
            }

            try {
                // 首先尝试使用Web Speech API（浏览器自带）
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // 取消之前的播报
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-CN'; // 设置为中文
                    utterance.rate = 0.9; // 语速稍慢，适合老年人
                    utterance.pitch = 1.0;
                    window.speechSynthesis.speak(utterance);
                    console.log('语音播报成功（使用Web Speech API）');
                    return;
                }

                // 如果Web Speech API不可用，尝试使用后端TTS
                const response = await fetch(`${API_BASE}/common/tts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const result = await response.json();
                if (result.success && result.audio) {
                    const audio = new Audio('data:audio/mp3;base64,' + result.audio);
                    audio.play();
                    console.log('语音播报成功（使用后端TTS）');
                } else {
                    // 如果后端TTS也失败，不弹窗，避免打扰用户
                    console.error('语音播报失败: ' + result.message);
                }
            } catch (error) {
                console.error('TTS调用失败:', error);
                // 不弹窗，避免打扰用户
            }
        }

        // 播报疾病信息
        function speakDiseaseInfo() {
            const diseaseName = document.getElementById('diseaseName').textContent;
            const diseaseDesc = document.getElementById('diseaseDesc').textContent;
            const doEat = document.getElementById('doEatList').textContent;
            const notEat = document.getElementById('notEatList').textContent;

            if (!diseaseName) {
                alert('暂无疾病信息可播报');
                return;
            }

            let text = `疾病名称：${diseaseName}。`;
            if (diseaseDesc && diseaseDesc !== '暂无描述') {
                text += `疾病描述：${diseaseDesc}。`;
            }
            if (doEat && doEat !== '暂无') {
                text += `宜吃食物：${doEat}。`;
            }
            if (notEat && notEat !== '暂无') {
                text += `忌吃食物：${notEat}。`;
            }

            callTTS(text);
        }

        // 播报AI咨询答案
        function speakConsultAnswer() {
            const answerElement = document.getElementById('consultAnswer');
            const answerText = answerElement.textContent || answerElement.innerText;

            if (!answerText) {
                alert('暂无AI回答可播报');
                return;
            }

            // 移除HTML标签，只保留文本内容
            const text = answerText.replace(/<[^>]*>/g, '').trim();
            callTTS(text);
        }

        // 字体大小控制
        let currentFontSize = 16; // 默认字体大小
        const minFontSize = 14;
        const maxFontSize = 24;

        document.getElementById('decrease-font').addEventListener('click', () => {
            if (currentFontSize > minFontSize) {
                currentFontSize -= 2;
                document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
                localStorage.setItem('fontSize', currentFontSize);
            }
        });

        document.getElementById('reset-font').addEventListener('click', () => {
            currentFontSize = 16;
            document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
            localStorage.setItem('fontSize', currentFontSize);
        });

        document.getElementById('increase-font').addEventListener('click', () => {
            if (currentFontSize < maxFontSize) {
                currentFontSize += 2;
                document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
                localStorage.setItem('fontSize', currentFontSize);
            }
        });

        // 加载保存的字体大小
        const savedFontSize = localStorage.getItem('fontSize');
        if (savedFontSize) {
            currentFontSize = parseInt(savedFontSize);
            document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
        }

        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(function (registration) {
                        console.log('Service Worker 注册成功:', registration.scope);
                    })
                    .catch(function (error) {
                        console.log('Service Worker 注册失败:', error);
                    });
            });
        }
    </script>
