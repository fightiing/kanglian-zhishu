    <script>
        // ==================== PCM音频采集核心模块 ====================
        // 全局变量
        let audioContext = null;
        let mediaStream = null;
        let scriptProcessor = null;
        let isRecording = false;
        let pcmDataChunks = []; // 存储PCM16数据块
        let recordedLength = 0; // 总录音时长（毫秒）
        let startTime = 0;

        // 全局状态变量
        let currentTranscript = "";
        let currentAnswer = "";
        let audioDataBlob = null;

        /**
         * 增强版文字格式美化工具函数 - 支持Markdown到HTML转换
         * @param {string} text - 待格式化的原始文字
         * @returns {string} 格式化后的美观文字（包含HTML标签）
         */
        function formatText(text) {
            if (!text || typeof text !== 'string') return '';

            // 先处理Markdown格式
            let formatted = convertMarkdownToHTML(text);

            // 然后进行其他格式处理
            formatted = formatted
                // 1. 去除首尾多余空白字符
                .trim()
                // 2. 去除中间连续的多个空白（保留单个空格）
                .replace(/\s+/g, ' ')
                // 3. 中英文标点统一（适配中文场景）
                .replace(/\.\s/g, '。 ')
                .replace(/,\s/g, '， ')
                .replace(/\?\s/g, '？ ')
                .replace(/!\s/g, '！ ')
                .replace(/;\s/g, '； ')
                .replace(/:\s/g, '： ')
                // 4. 段落换行处理
                .replace(/\\n/g, '\n')
                .replace(/\n/g, '<br><br>');

            return formatted;
        }

        /**
         * 修复版：将Markdown格式转换为HTML格式
         * @param {string} text - 包含Markdown格式的文本
         * @returns {string} 转换后的HTML文本
         */
        function convertMarkdownToHTML(text) {
            if (!text) return '';

            let html = text;

            // 1. 处理标题（## 标题）
            html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');

            // 2. 处理加粗（**加粗**）
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');

            // 3. 处理斜体（*斜体* 或 _斜体_）
            html = html.replace(/\*(?!\s)(.*?)(?<!\s)\*/g, '<em>$1</em>');
            html = html.replace(/_(?!\s)(.*?)(?<!\s)_/g, '<em>$1</em>');

            // 4. 处理无序列表（* 项目 或 - 项目）
            // 首先按行分割
            const lines = html.split('\n');
            let inUnorderedList = false;
            let inOrderedList = false;
            let unorderedListItems = [];
            let orderedListItems = [];
            let resultLines = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // 检查是否是无序列表项
                const unorderedMatch = line.match(/^[\s]*[*\-+]\s+(.+)/);
                // 检查是否是有序列表项（修复正则，只匹配数字+点+空格）
                const orderedMatch = line.match(/^[\s]*(\d+)\.\s+(.+)/);

                if (unorderedMatch) {
                    // 如果之前是有序列表，先结束它
                    if (inOrderedList) {
                        resultLines.push(`<ol>${orderedListItems.join('')}</ol>`);
                        orderedListItems = [];
                        inOrderedList = false;
                    }

                    if (!inUnorderedList) {
                        inUnorderedList = true;
                    }
                    // 提取列表项内容并处理其中的格式
                    let itemContent = unorderedMatch[1];
                    // 处理列表项内部的加粗
                    itemContent = itemContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    unorderedListItems.push(`<li>${itemContent}</li>`);
                }
                else if (orderedMatch) {
                    // 如果之前是无序列表，先结束它
                    if (inUnorderedList) {
                        resultLines.push(`<ul>${unorderedListItems.join('')}</ul>`);
                        unorderedListItems = [];
                        inUnorderedList = false;
                    }

                    if (!inOrderedList) {
                        inOrderedList = true;
                    }
                    // 提取列表项内容和数字
                    let itemNumber = orderedMatch[1];
                    let itemContent = orderedMatch[2];
                    // 处理列表项内部的加粗
                    itemContent = itemContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                    // 如果是第一个有序列表项，记录起始数字
                    if (orderedListItems.length === 0 && itemNumber !== '1') {
                        orderedListItems.push(`<li value="${itemNumber}">${itemContent}</li>`);
                    } else {
                        orderedListItems.push(`<li>${itemContent}</li>`);
                    }
                }
                else {
                    // 如果不是列表项，结束当前列表（如果有）
                    if (inUnorderedList) {
                        resultLines.push(`<ul>${unorderedListItems.join('')}</ul>`);
                        unorderedListItems = [];
                        inUnorderedList = false;
                    }
                    if (inOrderedList) {
                        resultLines.push(`<ol>${orderedListItems.join('')}</ol>`);
                        orderedListItems = [];
                        inOrderedList = false;
                    }
                    resultLines.push(line);
                }
            }

            // 处理最后一组列表
            if (inUnorderedList) {
                resultLines.push(`<ul>${unorderedListItems.join('')}</ul>`);
            }
            if (inOrderedList) {
                resultLines.push(`<ol>${orderedListItems.join('')}</ol>`);
            }

            html = resultLines.join('\n');

            // 5. 处理代码块（`代码`）
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 6. 处理引用（> 引用）
            html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');

            // 7. 处理水平线（--- 或 ***）
            html = html.replace(/^---$/gm, '<hr>');
            html = html.replace(/^\*\*\*$/gm, '<hr>');

            // 8. 处理链接（[文本](URL)）
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 9. 处理图片（![alt](URL)）
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

            // 10. 处理换行（两个空格+换行）
            html = html.replace(/  \n/g, '<br>');

            // 11. 清理残留的start属性（修复您提到的问题）
            html = html.replace(/start="\d+">/g, '>');

            return html;
        }

        /**
         * 检查答案是否为知识图谱未找到的情况
         */
        function isKnowledgeGraphEmpty(answer) {
            if (!answer) return true;

            const emptyPatterns = [
                '知识图谱中暂无',
                '暂无相关信息',
                '未找到相关信息',
                '图谱中没有',
                '未查询到',
                '暂无信息',
                '未收录',
                '图谱无法回答',
                '图谱无此信息'
            ];

            const lowerAnswer = answer.toLowerCase();
            return emptyPatterns.some(pattern =>
                lowerAnswer.includes(pattern.toLowerCase())
            );
        }

        /**
         * 调用大模型API获取答案
         */
        async function callLargeModel(query) {
            try {
                console.log('正在调用大模型API...');

                // 调用DeepSeek RAG服务API
                const response = await fetch('/api/deepseek/consult', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        question: query
                    })
                });

                if (!response.ok) {
                    throw new Error(`大模型API错误: ${response.status}`);
                }

                const result = await response.json();

                if (result.success && result.data && result.data.answer) {
                    return result.data.answer;
                } else {
                    // 如果DeepSeek RAG失败，尝试Neo4j增强的AI问答
                    return await callNeo4jAI(query);

            } catch (error) {
                console.error('调用大模型失败:', error);
                // 如果所有大模型都失败，返回友好的错误信息
                return '抱歉，大模型暂时无法处理您的请求。您可以尝试以下方法：\n\n1. 重新提问\n2. 联系系统管理员\n3. 检查网络连接';

        /**
         * 获取完整的AI回答（先知识图谱，失败时使用大模型）
         */
        async function getCompleteAnswer(transcript) {
            try {
                // 1. 先尝试本地知识图谱（通过语音询问接口）
                document.getElementById('recordStatus').textContent = '正在查询本地知识图谱...';

                // 发送音频数据到语音询问接口
                const base64Audio = await blobToBase64(audioDataBlob);
                const audioData = `data:audio/pcm;base64,${base64Audio}`;

                const kgResponse = await fetch('/api/voice/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        audio: audioData,
                        format: 'pcm',
                        sample_rate: 16000,
                        save_audio: true,
                        output_dir: 'output'
                    })
                });

                if (!kgResponse.ok) {
                    // API返回错误，直接使用大模型
                    console.error('知识图谱API错误:', kgResponse.status);
                    const lmAnswer = await callLargeModel(transcript);
                    return {
                        answer: lmAnswer,
                        source: 'large_model',
                        transcript: transcript,
                        extracted_disease: ''
                    };
                }

                const kgResult = await kgResponse.json();

                if (kgResult.success) {
                    const kgAnswer = kgResult.data.answer || '';
                    const kgTranscript = kgResult.data.transcript || transcript;
                    const extractedDisease = kgResult.data.extracted_disease || '';

                    // 2. 检查知识图谱是否找到答案
                    if (!isKnowledgeGraphEmpty(kgAnswer) && kgAnswer.length > 50) {
                        // 知识图谱找到答案
                        return {
                            answer: kgAnswer,
                            source: 'knowledge_graph',
                            transcript: kgTranscript,
                            extracted_disease: extractedDisease
                        };
                    } else {
                        // 知识图谱未找到，使用大模型
                        const lmAnswer = await callLargeModel(transcript);
                        return {
                            answer: lmAnswer,
                            source: 'large_model',
                            transcript: kgTranscript,
                            extracted_disease: extractedDisease
                        };
                    }
                } else {
                    // 知识图谱API失败，直接使用大模型
                    console.warn('知识图谱API失败，使用大模型:', kgResult.message);
                    const lmAnswer = await callLargeModel(transcript);
                    return {
                        answer: lmAnswer,
                        source: 'large_model_fallback',
                        transcript: transcript,
                        extracted_disease: ''
                    };
                }

            } catch (error) {
                console.error('获取答案失败:', error);
                // 所有方法都失败
                const fallbackAnswer = `抱歉，系统暂时无法回答您的问题。\n\n**错误信息**: ${error.message}\n\n**建议**: 请重新提问或联系管理员。`;
                return {
                    answer: fallbackAnswer,
                    source: 'error_fallback',
                    transcript: transcript,
                    extracted_disease: ''
                };
            }
        }

        /**
         * Blob转换为Base64
         */
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64data = reader.result.split(',')[1];
                    resolve(base64data);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        /**
         * 切换录音状态
         */
        async function toggleRecording() {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        }

        /**
         * 开始录音
         */
        async function startRecording() {
            try {
                resetUI();

                // 获取麦克风权限
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // 创建音频上下文
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });

                // 创建音频源
                const source = audioContext.createMediaStreamSource(mediaStream);

                // 创建脚本处理器用于获取原始PCM数据
                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

                // 重置数据存储
                pcmDataChunks = [];
                recordedLength = 0;
                startTime = Date.now();

                // 处理音频数据
                scriptProcessor.onaudioprocess = function (event) {
                    if (!isRecording) return;

                    // 获取输入缓冲区的PCM数据（Float32格式）
                    const inputData = event.inputBuffer.getChannelData(0);

                    // 将Float32转换为Int16（PCM16格式）
                    const pcm16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        // 将[-1, 1]范围的Float32转换为[-32768, 32767]的Int16
                        pcm16[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32767));
                    }

                    // 存储PCM16数据块
                    pcmDataChunks.push(pcm16);
                    recordedLength += (inputData.length / 16000) * 1000; // 计算毫秒数

                    // 更新录音状态显示
                    updateRecordingUI();
                };

                // 连接音频处理链
                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                // 更新状态
                isRecording = true;
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('recordStatus').textContent = '录音中...';
                document.getElementById('waveform').classList.add('active');

                // 隐藏之前的答案和音频详情
                document.getElementById('answerArea').classList.remove('show');
                document.getElementById('audioDetails').classList.remove('show');

                console.log("录音已开始");

            } catch (error) {
                console.error('录音启动失败:', error);
                showError('无法访问麦克风，请检查权限设置。错误：' + error.message);
            }
        }

        /**
         * 停止录音
         */
        function stopRecording() {
            if (!isRecording) return;

            // 停止音频处理
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor.onaudioprocess = null;
            }

            // 停止媒体流
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            // 关闭音频上下文
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
            }

            // 更新状态
            isRecording = false;
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('waveform').classList.remove('active');
            document.getElementById('recordStatus').textContent = '录音完成，正在识别...';

            // 显示音频详情
            showAudioDetails();

            // 显示加载提示
            document.getElementById('loading').classList.add('show');

            // 处理音频并获取答案
            processAudioAndGetAnswer();
        }

        /**
         * 处理音频并获取答案
         */
        async function processAudioAndGetAnswer() {
            try {
                // 合并PCM数据
                let totalLength = 0;
                pcmDataChunks.forEach(chunk => totalLength += chunk.length);

                const mergedPCM = new Int16Array(totalLength);
                let offset = 0;
                pcmDataChunks.forEach(chunk => {
                    mergedPCM.set(chunk, offset);
                    offset += chunk.length;
                });

                // 保存音频Blob
                audioDataBlob = new Blob([mergedPCM.buffer], { type: 'audio/pcm' });

                // 获取完整答案（知识图谱+大模型）
                const result = await getCompleteAnswer('语音输入');

                // 隐藏加载提示
                document.getElementById('loading').classList.remove('show');

                // 更新UI
                currentTranscript = formatText(result.transcript);
                currentAnswer = formatText(result.answer);

                // 添加答案来源标识
                let sourceBadge = '';
                let sourceText = '';
                switch (result.source) {
                    case 'knowledge_graph':
                        sourceBadge = '<span class="source-badge kg-badge">来自知识图谱</span>';
                        sourceText = '已从知识图谱获取答案';
                        break;
                    case 'large_model':
                        sourceBadge = '<span class="source-badge lm-badge">来自大模型</span>';
                        sourceText = '已使用大模型回答';
                        break;
                    case 'large_model_fallback':
                        sourceBadge = '<span class="source-badge lm-fallback-badge">大模型补充回答</span>';
                        sourceText = '知识图谱未找到，已使用大模型';
                        break;
                    default:
                        sourceBadge = '<span class="source-badge default-badge">系统回答</span>';
                        sourceText = '系统回答';
                }

                // 如果提取到了疾病名称，添加到转录文本中
                let transcriptText = currentTranscript;
                if (result.extracted_disease) {
                    transcriptText = `<strong>识别到的疾病：</strong>${result.extracted_disease}<br><br><strong>识别结果：</strong>${currentTranscript}`;
                } else {
                    transcriptText = `<strong>识别结果：</strong>${currentTranscript}`;
                }

                document.getElementById('transcriptBox').innerHTML = transcriptText;
                document.getElementById('answerBox').innerHTML = sourceBadge + currentAnswer;

                // 启用操作按钮
                document.getElementById('speakBtn').disabled = false;
                document.getElementById('downloadBtn').disabled = false;

                // 显示AI回答区域
                document.getElementById('answerArea').classList.add('show');

                document.getElementById('recordStatus').textContent = '处理完成';

                showSuccess(`处理完成！${sourceText}`);

            } catch (error) {
                console.error('处理失败:', error);
                document.getElementById('loading').classList.remove('show');
                const errorText = `处理失败: ${error.message}`;
                document.getElementById('transcriptBox').textContent = errorText;
                document.getElementById('recordStatus').textContent = '处理失败';
                showError(errorText);
            }
        }

        function resetUI() {
            document.getElementById('transcriptBox').textContent = '等待录音...';

        /**
         * 更新录音UI
         */
        function updateRecordingUI() {
            const seconds = Math.floor(recordedLength / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;

            const formatNum = (num) => num.toString().padStart(2, '0');
            const formattedMinutes = formatNum(minutes);
            const formattedSeconds = formatNum(remainingSeconds);

            let timeText = '';
            if (minutes > 0) {
                timeText = `${formattedMinutes}分${formattedSeconds}秒`;
            } else {
                timeText = `${formattedSeconds}秒`;
            }

            document.getElementById('recordStatus').textContent = `录音中... ${timeText}`;
            document.getElementById('audioDuration').textContent = timeText;
        }

        /**
         * 显示音频详情
         */
        function showAudioDetails() {
            let totalSize = 0;
            pcmDataChunks.forEach(chunk => totalSize += chunk.length * 2);

            document.getElementById('audioSize').textContent = `文件大小：${formatFileSize(totalSize)}`;
            const durationText = document.getElementById('audioDuration').textContent;
            document.getElementById('audioDuration').textContent = `录音时长：${durationText}`;

            document.getElementById('audioDetails').classList.add('show');
        }

        /**
         * 语音播报答复
         */
        async function speakAnswer() {
            const answerHtml = document.getElementById('answerBox').innerHTML;
            // 移除HTML标签和来源徽章，获取纯文本
            let answerText = answerHtml.replace(/<[^>]+>/g, '').trim();

            // 移除可能存在的来源标识文本
            answerText = answerText.replace(/来自知识图谱|来自大模型|大模型补充回答|系统回答/g, '').trim();

            if (!answerText) return;

            // 显示播放状态
            const speakBtn = document.getElementById('speakBtn');
            const originalText = speakBtn.textContent;
            speakBtn.textContent = '🔊 播放中...';
            speakBtn.disabled = true;

            try {
                // 首先尝试使用Web Speech API（浏览器自带）
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // 取消之前的播报
                    const utterance = new SpeechSynthesisUtterance(answerText);
                    utterance.lang = 'zh-CN'; // 设置为中文
                    utterance.rate = 0.9; // 语速稍慢，适合老年人
                    utterance.pitch = 1.0;

                    utterance.onend = function () {
                        speakBtn.textContent = originalText;
                        speakBtn.disabled = false;
                    };

                    utterance.onerror = function () {
                        speakBtn.textContent = originalText;
                        speakBtn.disabled = false;
                    };

                    window.speechSynthesis.speak(utterance);
                    return;
                }

                // 如果Web Speech API不可用，尝试使用后端TTS
                const response = await fetch('/api/common/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: answerText,
                        spd: 5,  // 语速
                        vol: 7,  // 音量
                        per: 0   // 发音人
                    })
                });

                if (!response.ok) {
                    throw new Error(`TTS API错误: ${response.status}`);
                }

                const result = await response.json();
                if (result.success && result.audio) {
                    // 创建音频元素并播放
                    const audio = new Audio(`data:audio/mp3;base64,${result.audio}`);
                    audio.play();

                    audio.onended = function () {
                        speakBtn.textContent = originalText;
                        speakBtn.disabled = false;
                    };

                    audio.onerror = function () {
                        speakBtn.textContent = originalText;
                        speakBtn.disabled = false;
                    };
                } else {
                    throw new Error(result.message || '语音合成失败');
                }
            } catch (error) {
                console.error('语音播报失败:', error);
                // 恢复按钮状态
                speakBtn.textContent = originalText;
                speakBtn.disabled = false;
                // 不弹窗，避免打扰用户
            }
        }

        /**
         * 下载识别结果
         */
        function downloadResults() {
            if (!currentTranscript && !currentAnswer) {
                showError('没有可下载的内容');
                return;
            }

            try {
                // 清理HTML标签，保留纯文本
                const cleanTranscript = currentTranscript.replace(/<[^>]+>/g, '').trim();
                const cleanAnswer = currentAnswer.replace(/<[^>]+>/g, '').trim();
                const cleanDuration = document.getElementById('audioDuration').textContent.replace(/录音时长：/g, '');
                const cleanSize = document.getElementById('audioSize').textContent.replace(/文件大小：/g, '');

                // 创建JSON数据
                const resultData = {
                    timestamp: new Date().toLocaleString(),
                    transcript: formatText(cleanTranscript),
                    answer: formatText(cleanAnswer),
                    audio_info: {
                        format: 'PCM',
                        sample_rate: '16000 Hz',
                        duration: cleanDuration,
                        size: cleanSize
                    },
                    source: '医疗智能问答系统'
                };

                // 转换为JSON字符串
                const jsonStr = JSON.stringify(resultData, null, 2);

                // 创建下载链接
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `医疗问答_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showSuccess('结果已下载');

            } catch (error) {
                console.error('下载失败:', error);
                showError('下载失败: ' + error.message);
            }
        }

        /**

            const messageEl = document.createElement('div');

                setTimeout(() => {
                    if (messageEl.parentNode) {
                        messageEl.parentNode.removeChild(messageEl);
                    }
                }, 300);
            }, 3000);
        }

        /**
         * 格式化文件大小
         */
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
